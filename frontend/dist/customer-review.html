<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link rel="preconnect" href="https://fonts.googleapis.com">

<body>
    <a class="back-btn" href="/">← Back to Home</a>

        <h1>Review Orders</h1>
        <p>Example customer orders. Cancellation is a preview and does not change saved data.</p>
        <p><a href="/customer.html">Back to Customer page</a></p>

        <table class="orders-table">
            <thead>
                <tr>
                    <th>Order</th>
                    <th>Product</th>
                    <th>Quantity</th>
                    <th>Total</th>

            <tbody>
                <tr>
                    <td>1001</td>
                    <td>Wireless headphones</td>
                    <td>1</td>

                    <td><button type="button" disabled>Cancel (demo)</button></td>
                </tr>
                <tr>
                    <td>1002</td>
                    <td>Notebook</td>
                    <td>2</td>
                    <td>$12.00</td>
                    <td>Shipped</td>
                    <td><button type="button" disabled>Cancel (demo)</button></td>
                </tr>
            </tbody>
        </table>
        <p><a href="/complaints.html">Register a complaint</a></p>
